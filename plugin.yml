name: StarDuels
version: 5.1.10
main: com.meowduels.MeowDuels
api-version: '1.21.11'
author: nafehawan
description: StarDuels - duels, parties, queues and FFA events for Paper 1.21.11.
softdepend:
  - FastAsyncWorldEdit
  - PlaceholderAPI
  - TAB

commands:
  starduels:
    description: StarDuels admin commands for kits, arenas, and configuration.
    usage: /starduels <createkit|editkit|viewkits|reload|scoreboardip|setspawn|arena>
    aliases: [sd, md, meowduels]
  createarena:
    description: Create a new arena.
    usage: /createarena <name> | /createarena hungergames [name]
    permission: meowduels.admin
  arena:
    description: Open the arena setup/settings GUI, or clone/regen/snapshot it.
    usage: /arena <name> [copy|paste|regen|snapshot]
    permission: meowduels.admin
  deletearena:
    description: Delete an arena.
    usage: /deletearena <name>
    permission: meowduels.admin
  kitcreate:
    description: Create a kit from your current inventory.
    usage: /kitcreate <name>
    permission: meowduels.admin
  kiteditor:
    description: Arrange your own layout for each kit (personal, not server-wide).
    usage: /kiteditor
  deletekit:
    description: Delete a kit.
    usage: /deletekit <name>
    permission: meowduels.admin
  kiticon:
    description: Set a kit's menu icon to the item in your hand.
    usage: /kiticon <name>
    permission: meowduels.admin
  kitdisplayname:
    description: Set a kit's display name (MiniMessage format).
    usage: /kitdisplayname <name> <display...>
    permission: meowduels.admin
  editgui:
    description: Customise a GUI layout (duelconfirm, mapselect).
    usage: /editgui <menu>
    permission: meowduels.admin
  category:
    description: Manage kit-menu categories.
    usage: /category <list|create|delete|header|addkit|removekit> ...
    permission: meowduels.admin
  categoryqueue:
    description: Manage queue-menu categories.
    usage: /categoryqueue <list|create|delete|header|addkit|removekit> ...
    permission: meowduels.admin
  scoreboardip:
    description: Set the server IP shown on the duel scoreboard.
    usage: /scoreboardip <ip>
    permission: meowduels.admin
  meowduelssetspawn:
    description: Set the location every duel returns players to when it ends.
    usage: /meowduelssetspawn
    permission: meowduels.admin
  leaderboard:
    description: Show the duel wins leaderboard.
    usage: /leaderboard [size]
    aliases: [lb, wintop]
  duel:
    description: Challenge a player to a duel.
    usage: /duel <player> [kit] [rounds]
  party:
    description: Create or manage parties and host party modes.
    usage: /party hungergames | create | invite <player> | join [leader] | decline <player> | duel <accept|decline> <leader> | spectate | force_end | leave
    aliases: [p]
  leave:
    description: Leave your current duel, spectate session, or queues.
    usage: /leave
  ff:
    description: Forfeit your current duel.
    usage: /ff
  event:
    description: Join a hosted event, or host one.
    usage: /event | /event host <kit> <minutes> [slots] | /event host force_start
  eventspec:
    description: Spectate the current event.
    usage: /eventspec
  eventleave:
    description: Leave the event you're playing or spectating.
    usage: /eventleave
  meowduelsspawnitems:
    description: Give yourself the spawn hotbar items (for /spawn hooks).
    usage: /meowduelsspawnitems
  queue:
    description: Join a kit queue directly, open the queue menu, or /queue leave.
    usage: /queue [kit|leave]
  editkit:
    description: Admin kit editor - start effects, items, and Change Kit.
    usage: /editkit [kit]
    permission: meowduels.admin
  spectate:
    description: Spectate a player (or /spectate to stop).
    usage: /spectate [player]
    aliases: [spec]
  givegoldenhead:
    description: Give a player Golden Heads (modern UHC healing item).
    usage: /givegoldenhead [player] [amount]
    permission: uhc.admin.givehead
  resetconfig:
    description: Reset MeowDuels config.yml and wipe all arenas back to defaults.
    usage: /meowduels:resetconfig
    permission: meowduels.admin
  meowduelsserver:
    description: Set the server name shown as the duel scoreboard title.
    usage: /meowduelsserver <name...>
    permission: meowduels.admin
  meowduelstrims:
    description: Open the armor-trim editor for a kit.
    usage: /meowduelstrims [kit]
    permission: meowduels.trims
    aliases: [trims, mdtrims]
permissions:
  hg.host.party:
    description: Allow a party leader to host Hunger Games.
    default: op
  starduels.hungergames.host:
    description: Alias permission for hosting party Hunger Games.
    default: op
  starduels.admin:
    description: Access to StarDuels administration.
    default: op
    children:
      meowduels.admin: true
      starduels.trims: true
      starduels.trims.all: true
      starduels.event.host: true
      starduels.vip: true
  starduels.vip:
    description: "Standard VIP bundle: lobby elytra and wind charge, all armor trims, and party size up to 10."
    default: false
    children:
      starduels.trims: true
      starduels.trims.all: true
      starduels.elytra.true: true
      starduels.party.size.10: true
  starduels.use:
    description: Access to StarDuels player features.
    default: true
  starduels.trims:
    description: Open the armor trim editor.
    default: op
    children:
      meowduels.trims: true
  starduels.trims.all:
    description: Use any armor trim pattern and material.
    default: op
  starduels.event.host:
    description: Host StarDuels events.
    default: op
    children:
      meowduels.event.host: true
