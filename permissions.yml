# StarDuels permission reference (copy the nodes into your permissions plugin).
# VIP bundle: starduels.vip
# It grants lobby elytra, the full trim set, and party size 10.
# To grant trim access individually, grant starduels.trims and one or more
# starduels.trim.<pattern>.<material> nodes below. starduels.trims.all grants every trim.
# Add starduels.elytra.false to explicitly deny lobby elytra.
permissions:
  starduels.vip:
    description: Standard VIP bundle.
    children:
      starduels.trims: true
      starduels.trims.all: true
      starduels.elytra.true: true
      starduels.party.size.10: true
  starduels.admin:
    description: Access to StarDuels administration.
    default: op
    children:
      meowduels.admin: true
      starduels.trims: true
      starduels.trims.all: true
      starduels.event.host: true
      starduels.vip: true
  starduels.use:
    description: Access to StarDuels player features.
    default: true
  starduels.trims:
    description: Open the trim editor.
  starduels.trims.all:
    description: Use every trim combination.
  starduels.elytra.true:
    description: Use the lobby elytra.
  starduels.elytra.false:
    description: Deny the lobby elytra.
  starduels.event.host:
    description: Host events.
    default: op
  starduels.party.size.2:
    description: Allow a party size of 2.
    default: true
  meowduels.admin:
    description: Admin commands.
    default: op
  meowduels.use:
    description: Access to duel features.
    default: true
  meowduels.trims:
    description: Legacy trim editor permission.
    default: op
  meowduels.event.host:
    description: Legacy event hosting permission.
    default: op
  meowduels.bypass.commands:
    description: Bypass match command restrictions.
    default: op
  uhc.admin.givehead:
    description: Give Golden Heads with the admin command.
    default: op
